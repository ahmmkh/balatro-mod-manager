name: Canary - does the index actually install

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "How many mods to install (a number, or 'all')"
        default: "40"
        required: false
      catalog:
        description: "Catalog base URL or index.json path (default: repository variable BMI_CATALOG_URL, else https://bmi.khatab.me)"
        required: false

jobs:
  canary:
    name: Canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-canary-${{ hashFiles('**/Cargo.lock') }}

      # Reads each mod's downloadURL from the catalog. It never calls POST /mods/{id}/download,
      # so it cannot inflate the public download counters.
      - name: Install a sample of the catalog with the real installer
        shell: bash
        env:
          SAMPLE: ${{ inputs.sample || '40' }}
          CATALOG: ${{ inputs.catalog || vars.BMI_CATALOG_URL || 'https://bmi.khatab.me' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS_NAME: ${{ runner.os }}
        run: |
          SEED=$(date -u +%Y%m%d)
          set +e
          cargo run --release -p bmm-lib --example canary -- \
            --catalog "$CATALOG" --sample "$SAMPLE" --seed "$SEED" \
            --out "canary-$OS_NAME.json" | tee "canary-$OS_NAME.md"
          STATUS=${PIPESTATUS[0]}
          cat "canary-$OS_NAME.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-${{ runner.os }}
          path: |
            canary-*.json
            canary-*.md
          if-no-files-found: ignore
          retention-days: 14
