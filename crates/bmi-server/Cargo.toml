[package]
name = "bmi-server"
version = "0.1.0"
edition = "2024"
description = "Balatro Mod Index backend"
publish = false

[lib]
name = "bmi_server"

[[bin]]
name = "bmi-server"
path = "src/main.rs"

[dependencies]
bmi-core = { path = "../bmi-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.9"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3.27.0"
